# /etc/nginx/sites-available/autojurnal — site BARU, tidak mengubah site lain.
# HTTPS ditambahkan otomatis oleh: sudo certbot --nginx -d autojurnal.redscale.my.id
server {
    listen 80;
    listen [::]:80;
    server_name autojurnal.redscale.my.id;

    client_max_body_size 55M;          # naskah bergambar bisa besar

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;       # pengecekan dengan AI bisa > 1 menit
    }
}
